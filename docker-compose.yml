services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eqms-app
    container_name: eqms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage_data:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-eqms}
      - DB_USERNAME=${DB_USERNAME:-eqms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
      - QUEUE_CONNECTION=database
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: eqms-app
    container_name: eqms-queue
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-eqms}
      - DB_USERNAME=${DB_USERNAME:-eqms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
      - QUEUE_CONNECTION=database
    entrypoint: []
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=3", "--tries=3", "--backoff=60", "--timeout=90"]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: eqms-app
    container_name: eqms-scheduler
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-eqms}
      - DB_USERNAME=${DB_USERNAME:-eqms_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: eqms-db
    restart: unless-stopped
    expose:
      - "3306"
    ports:
      # Hanya bind ke localhost jika diakses dari tools database lokal (tidak terbuka ke publik)
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-eqms}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret123}}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  storage_data:

